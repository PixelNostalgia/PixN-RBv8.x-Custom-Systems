<systemList>
<system>
    <name>globalvr</name>
    <fullname>Global VR</fullname>
    <manufacturer>Global VR</manufacturer>
    <release>1998</release>
    <hardware>arcade</hardware>
    <path>~\..\roms\globalvr</path>
    <extension>.teknoparrot</extension>
