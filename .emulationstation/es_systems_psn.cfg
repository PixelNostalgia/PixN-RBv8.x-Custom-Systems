<?xml version="1.0" encoding="UTF-8"?>
<!-- *** es_systems.cfg edited for RetroBat by PixN TEAM ***-->
<systemList>
  <system>
    <name>psn</name>
    <fullname>Playstation Network</fullname>
    <manufacturer>Sony</manufacturer>
    <release>2006</release>
    <hardware>console</hardware>
    <path>~\..\roms\psn</path>
    <extension>.squashfs</extension>
    <command>"%HOME%\emulatorLauncher.exe" -gameinfo %GAMEINFOXML% %CONTROLLERSCONFIG% -system %SYSTEM% -emulator %EMULATOR% -core %CORE% -rom %ROM%</command>
    <emulators>
      <emulator name="rpcs3"/>
    </emulators>
    <platform>ps3</platform>
    <theme>psn</theme>
  </system>
</systemList>
